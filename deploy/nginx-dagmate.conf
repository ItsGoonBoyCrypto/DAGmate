# DAGmate — nginx vhost for dagmate.org.
#
#   cp deploy/nginx-dagmate.conf /etc/nginx/sites-available/dagmate
#   ln -s /etc/nginx/sites-available/dagmate /etc/nginx/sites-enabled/dagmate
#   certbot --nginx -d dagmate.org -d www.dagmate.org
#   nginx -t && systemctl reload nginx
#
# nginx is the only thing on this box that faces the internet. The site backend
# is on 127.0.0.1:8800, the Kaspa sidecar on 127.0.0.1:8910 — and the sidecar
# is NEVER proxied here. It holds the arbiter keys and has no auth of its own
# beyond not being reachable; a location block pointing at it would hand the
# internet an unauthenticated settlement signer.

# Rate limits. `binary_remote_addr` is the client IP, and these are declared at
# http scope, so this file must be included from nginx.conf's http block (the
# sites-enabled default on Debian/Ubuntu).
#
# Two zones, because two different things are being protected:
#
#  - auth: issuing a login nonce is the cheapest way to make the server do work
#    and write a row. 10r/m is generous for a human (one login) and useless for
#    a script.
#  - api: everything else. The frontend polls a live match every 4 seconds, and
#    a player may have several tabs open, so this has to sit well above normal
#    use — it exists to stop a flood, not to police a keen player.
limit_req_zone $binary_remote_addr zone=dagmate_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dagmate_api:10m rate=10r/s;

# Don't advertise the nginx version anywhere — Server: header and error pages,
# across all three vhosts (the :80 redirect and the www redirect included, not
# just the canonical https site). At http scope so it can't be forgotten on one.
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name dagmate.org www.dagmate.org;

    # Leave ACME on plain HTTP so renewals don't depend on the cert they renew.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dagmate.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dagmate.org;

    ssl_certificate     /etc/letsencrypt/live/dagmate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dagmate.org/privkey.pem;
    # Pin the same modern floor as the canonical vhost. Without this the www
    # server (which, being first, is nginx's DEFAULT for :443) would fall back
    # to the compiled-in ssl_protocols default, which on older nginx still
    # includes TLS 1.0/1.1 — so a raw-IP or unknown-SNI client would negotiate
    # a weak protocol here even though the real site is 1.2+.
    ssl_protocols TLSv1.2 TLSv1.3;

    # One canonical origin. The login message a wallet signs names a domain
    # (DAGMATE_AUTH_DOMAIN), and a session cookie/token issued on one host and
    # replayed on another is a needless second surface — so www redirects
    # rather than serving.
    return 301 https://dagmate.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dagmate.org;

    ssl_certificate     /etc/letsencrypt/live/dagmate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dagmate.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is the one security header nginx owns: it's a statement about the TLS
    # transport, which the backend (behind TLS termination) can't make. Every
    # OTHER security header — CSP, X-Frame-Options, nosniff, Referrer-Policy,
    # Permissions-Policy — is set by the SITE BACKEND itself (see
    # site/backend/main.py `_security_headers`) and passes through this proxy on
    # the response, including on the static HTML page and the piece SVGs.
    #
    # This is deliberate, and it's the fix for the old inheritance bug: when
    # these headers were declared here with `add_header`, any `location` block
    # that had its OWN `add_header` (the cache-control ones below) silently
    # dropped ALL of them for that location — so the HTML document, the one page
    # that most needs a CSP, was served without one. Making the backend the
    # single source means the CSP rides on the response body itself and can't be
    # reset by a location's unrelated header. nginx no longer re-adds them, so
    # there is exactly one of each, everywhere.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 256k;   # every request here is a small JSON body

    # Login: strict. burst=5 nodelay lets a real person retry a failed sign
    # without waiting, then throttles.
    location ~ ^/api/auth/(nonce|verify)$ {
        limit_req zone=dagmate_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=dagmate_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/proxy_params;

        # A settle or reclaim build talks to a Kaspa node mid-request; the
        # default 60s read timeout is enough, but say so rather than inherit it.
        proxy_read_timeout 60s;
        proxy_buffering off;   # small JSON, and the client is waiting on it
    }

    # Static frontend, served by the same backend process (it mounts
    # StaticFiles at /). Cached briefly rather than aggressively: this is a
    # single hand-edited index.html + app.js with no content hashing, so a long
    # max-age would strand players on an old client after a deploy.
    location / {
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/proxy_params;
        # `expires` emits Cache-Control on its own. We do NOT add an explicit
        # `add_header Cache-Control` here: an add_header in this block would
        # reset add_header inheritance and, historically, dropped the security
        # headers from the HTML page. The backend now owns those headers, but
        # keeping this block free of add_header keeps the rule simple.
        expires 5m;
    }

    # Piece SVGs never change. Safe to cache hard, and there are 12 of them on
    # every board render.
    location /assets/ {
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/proxy_params;
        expires 30d;
    }
}
